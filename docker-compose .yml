version: '3.8'

services:
  ros2_ai_workstation:
    build: 
      context: ./
      dockerfile: Dockerfile
    image: ros2_humble_ai_gesture:v1.0
    container_name: ros2_ai_workstation
    
    # ========== Network Configuration ==========
    # MUST use host mode for ROS2 communication
    network_mode: host
    
    # ========== Privileges and IPC ==========
    privileged: true
    ipc: host
    
    # ========== GPU Configuration (if NVIDIA GPU available) ==========
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    
    # ========== Environment Variables ==========
    environment:
      # X11 display
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      
      # NVIDIA GPU (if available)
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      
      # ROS2 configuration
      - ROS_DOMAIN_ID=30
      - TURTLEBOT3_MODEL=waffle_pi
      
      # ROS2 workspace (optional)
      - ROS_WORKSPACE=/root/ros2_ws
    
    # ========== Device Mapping ==========
    devices:
      - /dev/video0:/dev/video0    # Camera (required)
      # If you have multiple cameras, add:
      # - /dev/video1:/dev/video1
    
    # ========== Volume Mapping ==========
    volumes:
      # X11 display support (required)
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      
      # Your code directory
      # Modify the left path to your actual code location
      - ./my_code:/root/my_code
      
      # ROS2 workspace (if available)
      - ./ros2_ws:/root/ros2_ws
      
      # Downloads directory (for copying files)
      - ./downloads:/root/downloads
    
    # ========== Terminal Configuration ==========
    stdin_open: true
    tty: true
    
    # ========== Startup Command (optional) ==========
    # Default: enter bash, can also auto-start nodes
    # command: bash
    # Or:
    # command: >
    #   bash -c "source /opt/ros/humble/setup.bash &&
    #            source ~/ros2_ws/install/setup.bash &&
    #            bash"
